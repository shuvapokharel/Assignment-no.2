<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Style Your Text</title>
</head>
<body>
  <form id="styleForm">
    <label for="textColor">Text color:</label>
    <input type="text" id="textColor" placeholder="red, blue, #ff0000" required>
    <br><br>

    <label for="bgColor">Background color:</label>
    <input type="text" id="bgColor" placeholder="white, black, #ffffff" required>
    <br><br>

    <label for="content">Text content:</label>
    <input type="text" id="content" placeholder="Hello, World!" required>
    <br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="output"></p>

  <script src="script.js" ></script>
</body>
</html>
